version: "3.8"

services:
  site1_warehouse:
    image: mysql:8.0
    container_name: tpcc_site1_warehouse
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: warehouse_db
    ports:
      - "3308:3306"
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - ./db/site1:/docker-entrypoint-initdb.d

  site2_customer:
    image: mysql:8.0
    container_name: tpcc_site2_customer
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: customer_db
    ports:
      - "3307:3306"
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - ./db/site2:/docker-entrypoint-initdb.d
